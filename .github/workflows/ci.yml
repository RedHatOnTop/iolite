name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: host (Fedora 44)
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install toolchain and GStreamer headers
        run: >
          dnf -y install git cargo rust rustfmt clippy gcc pkgconf-pkg-config
          gstreamer1-devel gstreamer1-plugins-base-devel
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: host-
      - run: cargo fmt --all --check
      - run: cargo clippy -p iolite-proto -p iolite-client -p iolite-host --all-targets -- -D warnings
      - run: cargo test -p iolite-proto -p iolite-client -p iolite-host
      - run: cargo build --release -p iolite-host
      - uses: actions/upload-artifact@v4
        with:
          name: iolite-host-fedora44-x86_64
          path: |
            target/release/iolite
            Cargo.lock

  android:
    runs-on: ubuntu-24.04
    env:
      IOLITE_KEYSTORE_B64: ${{ secrets.IOLITE_KEYSTORE_B64 }}
      IOLITE_KEYSTORE_PASSWORD: ${{ secrets.IOLITE_KEYSTORE_PASSWORD }}
      IOLITE_KEY_ALIAS: ${{ secrets.IOLITE_KEY_ALIAS }}
      IOLITE_KEY_PASSWORD: ${{ secrets.IOLITE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build the JNI library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release -p iolite-android
      - name: Use the release key when the repository has one
        run: |
          if [ -n "$IOLITE_KEYSTORE_B64" ]; then
            echo "$IOLITE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iolite.jks"
            echo "IOLITE_KEYSTORE=$RUNNER_TEMP/iolite.jks" >> "$GITHUB_ENV"
          fi
      - run: gradle -p android assembleRelease
      - run: mv android/app/build/outputs/apk/release/app-release.apk iolite.apk
      - uses: actions/upload-artifact@v4
        with:
          name: iolite-android
          path: iolite.apk

  e2e:
    name: end to end (emulator + test host)
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
          gst-inspect-1.0 --exists av1enc && echo "av1enc present" || echo "av1enc missing"
          gst-inspect-1.0 --exists svtav1enc && echo "svtav1enc present" || echo "svtav1enc missing"
      - run: cargo build -p iolite-host
      - uses: actions/download-artifact@v4
        with:
          name: iolite-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start a test host
        run: |
          mkdir -p "$RUNNER_TEMP/cfg"
          XDG_CONFIG_HOME="$RUNNER_TEMP/cfg" nohup target/debug/iolite serve --test-source --insecure-auto-approve > host.log 2>&1 &
          sleep 2
          cat host.log
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r iolite.apk
            adb logcat -c
            adb shell am start -n io.github.redhatontop.iolite/.MainActivity --es host 10.0.2.2 --ei port 46100 --ez autoconnect true
            sleep 30
            adb exec-out screencap -p > stream.png
            adb shell input tap 540 1200
            sleep 3
            adb logcat -d > logcat.txt
            grep -q "first frame rendered" logcat.txt
      - name: Check that a tap reached the host
        run: grep -q "input: Touch" host.log
      - if: always()
        run: |
          cat host.log
          grep -E "iolite|AndroidRuntime|MediaCodec" logcat.txt | tail -200 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            stream.png
            logcat.txt
            host.log
